name: Deploy web to GitHub Pages

# Move this file to .github/workflows/pages.yml (see the README).
# Manual on purpose: it only works after Pages is enabled for the repo
# (Settings -> Pages -> Source: GitHub Actions). Once that's done you can add
#   push:
#     branches: [master]
#     paths: ['web/**', 'slang.json']
# under `on:` to publish automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
